name: Build RAMBO APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PATH: /usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/local/bin:/usr/bin:/bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Download Sherpa-ONNX Android AAR
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar \
            --output app/libs/sherpa-onnx-1.13.8.aar

      - name: Download Piper Amy voice model
        run: |
          mkdir -p app/src/main/assets/tts
          curl --fail --location --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-amy-low.tar.bz2 \
            --output /tmp/rambo-piper-model.tar.bz2
          tar -xjf /tmp/rambo-piper-model.tar.bz2 -C /tmp
          MODEL_DIR="$(find /tmp -maxdepth 3 -type f -name 'en_US-amy-low.onnx' -printf '%h\n' | head -n 1)"
          test -n "$MODEL_DIR"
          cp "$MODEL_DIR/en_US-amy-low.onnx" app/src/main/assets/tts/
          cp "$MODEL_DIR/tokens.txt" app/src/main/assets/tts/
          cp -R "$MODEL_DIR/espeak-ng-data" app/src/main/assets/tts/
          test -s app/src/main/assets/tts/en_US-amy-low.onnx
          test -s app/src/main/assets/tts/tokens.txt

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAMBO-debug
          path: app/build/outputs/apk/debug/app-debug.apk
